name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # 首次运行自动启用 Pages（GitHub Actions 构建模式）
      - name: Build pick
        run: python3 scripts/build-index.py
        working-directory: pick
      - name: Check pick（防漂移断言：链接 520 / 模板残留 / 新鲜度）
        run: python3 scripts/check.py
        working-directory: pick
      - name: Build apprentice
        run: python3 scripts/build-index.py
        working-directory: apprentice
      - name: Build mistakes
        run: python3 scripts/build-index.py
        working-directory: mistakes
      - name: Build spark
        run: python3 scripts/build-index.py
        working-directory: spark
      - name: Build atlas（门户 + 错题集视图）
        run: python3 scripts/build-atlas.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
